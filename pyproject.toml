[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trailstop-analyzer"
version = "0.1.0"
description = "Trailing-Stop-Risikoanalyse per ISIN (Streamlit)"
requires-python = ">=3.12"
authors = [
    { name = "Trailstop Analyzer", email = "info@trailstop-analyzer.com" }
]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=2.4.0",
    "streamlit>=1.45.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
]

[project.urls]
Homepage = "https://github.com/trailstop-analyzer/trailstop-analyzer"

[tool.setuptools.packages.find]
where = ["."]
include = ["trailstop*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
